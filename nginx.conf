events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    server {
        listen 80;
        server_name localhost;
        
        # Security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        
        # Root location - test reports index
        location / {
            root /usr/share/nginx/html;
            index index.html;
            
            # Custom index page for test reports
            try_files $uri $uri/ =404;
            
            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # Playwright HTML reports
        location /playwright/ {
            alias /usr/share/nginx/html/playwright/;
            index index.html;
            
            # Enable directory browsing for test results
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            # Security for sensitive test data
            auth_basic "Test Reports";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        
        # Allure reports
        location /allure/ {
            alias /usr/share/nginx/html/allure/;
            index index.html;
            
            # Enable directory browsing
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            # Security for sensitive test data
            auth_basic "Test Reports";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # API endpoint for test status
        location /api/status {
            default_type application/json;
            return 200 '{"status":"running","timestamp":"$time_iso8601"}';
        }
        
        # WebSocket support for live updates
        location /ws {
            proxy_pass http://playwright-tests:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # HTTPS server configuration (for production)
    server {
        listen 443 ssl http2;
        server_name localhost;
        
        # SSL configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # Same configuration as HTTP server
        include /etc/nginx/conf.d/default.conf;
    }
}